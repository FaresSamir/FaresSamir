name: Generate Snake Animation

on:
  # Rebuild every day at midnight UTC so the snake stays in sync with new commits
  schedule:
    - cron: "0 0 * * *"
  # Lets you trigger it by hand from the Actions tab
  workflow_dispatch:
  # Also rebuild whenever you push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: FaresSamir
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push the result to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
